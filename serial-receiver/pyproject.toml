[project]
name = "serial-receiver"
version = "0.1.0"
description = "Receives COBS-framed, CRC-16-protected packets streamed over a serial port and dispatches them to configurable handlers"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Marco Picone", email = "picone.m@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pyserial>=3.5",
]

[project.scripts]
serial-receiver = "serial_receiver.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
