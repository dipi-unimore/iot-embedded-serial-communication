; Streams COBS-framed, CRC-16-protected binary packets over the USB serial link.
; See ../README.md for the protocol.
;
; Build + flash:  pio run -t upload
; Do NOT use `pio device monitor` to read the data: the stream is binary. Use
; the Python receiver in ../serial-receiver instead.

[env:esp32-c3-devkitc-02]
platform = espressif32
board = esp32-c3-devkitc-02
framework = arduino
monitor_speed = 921600

; This board only has 2MB of flash, but the generic board manifest assumes 4MB.
board_upload.flash_size = 2MB
; Arduino's default partition table is laid out for 4MB, so it can't be used here.
board_build.partitions = partitions.csv

build_flags =
    ; The Arduino core's log_x() output goes to the same UART as the binary
    ; stream and would corrupt it - keep it silent.
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    bakercp/PacketSerial@^1.4.0
